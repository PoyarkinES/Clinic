syntax = "proto3";

option csharp_namespace = "Service";
import "google/api/annotations.proto";

package country;

//gRPC country dictionary service
service CountryProto{
	rpc CreateCountryAsync(CreateCountryRequest) returns (CreateCountryResponse) { option (google.api.http) = { get: "/v1/country/create/{isocode}/{fullname}/{shortname}/{alfa2code}/{alfa3code}" }; };
	rpc GetCountryAsync(GetCountryRequest) returns (GetCountryResponse);
	rpc GetCountriesAsync(GetCountriesRequest) returns (GetCountriesResponse);
	rpc UpdateCountryAsync(UpdateCountryRequest) returns (UpdateCountryResponse);
	rpc DeleteCountryAsync(DeleteCountryRequest) returns (DeleteCountryResponse);
}

//gRPC dictionary ciuntry model 
message CountryModel{
	int32 countryId = 1;
	string isocode = 2;
	string fullname = 3;
	string shortname = 4;
	string alfa2code = 5;
	string alfa3code = 6;
	string created_at = 7;
	string updated_at = 8;
	string tags = 9;
}

// Create new country request
message CreateCountryRequest{
	string isocode = 1;
	string fullname = 2;
	string shortname = 3;
	string alfa2code = 4;
	string alfa3code = 5;
	string tags = 6;
}

// Create new country response
message CreateCountryResponse{
	bool success = 1;
	string message = 2;
	CountryModel country = 3;
}

// Get country by Id request
message GetCountryRequest {
	int32 countryId = 1;
}

// Get country by Id response
message GetCountryResponse {
	bool success = 1;
	string message = 2;
	CountryModel country = 3;
}

// Get countries request
message GetCountriesRequest {
	int32 page = 1;
	int32 page_size = 2;
}

// Get countries response
message GetCountriesResponse {
	bool success = 1;
	string message = 2;
	repeated CountryModel country = 3;
	int32 total_count = 4;
}

// Update country by Id request
message UpdateCountryRequest {
	int32 countryId = 1;
	string isocode = 2;
	string fullname = 3;
	string shortname = 4;
	string alfa2code = 5;
	string alfa3code = 6;
	string tags = 7;
}

// Update country by Id response
message UpdateCountryResponse {
	bool success = 1;
	string message = 2;
	CountryModel country = 3;
}

// Delete country by Id request
message DeleteCountryRequest {
	int32 countryId = 1;
}

// Delete country by Id response
message DeleteCountryResponse {
	bool success = 1;
	string message = 2;
}